<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抽籤程式</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --accent: #f59e0b;
        --text: #1f2937;
        --muted: #6b7280;
        --danger: #ef4444;
        --success: #10b981;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .app {
        width: min(900px, 100%);
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(79, 70, 229, 0.08);
        border-radius: 22px;
        box-shadow: 0 24px 60px rgba(79, 70, 229, 0.12);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
        color: white;
        padding: 28px 32px;
      }

      .header h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        letter-spacing: 0.08em;
      }

      .content {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
        padding: 28px 32px 32px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 20px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 10px;
        color: var(--text);
      }

      textarea,
      input {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        resize: vertical;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      textarea:focus,
      input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      textarea {
        min-height: 180px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 10px 18px rgba(79, 70, 229, 0.20);
      }

      .primary:hover { background: var(--primary-dark); }

      .secondary {
        background: #eef2ff;
        color: var(--primary);
      }

      .danger {
        background: #fee2e2;
        color: var(--danger);
      }

      .result-box {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100%;
      }

      .result-label {
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .winner {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
        border: 1px solid rgba(245, 158, 11, 0.3);
        border-radius: 16px;
        padding: 24px 18px;
        min-height: 180px;
        font-weight: 900;
        font-size: clamp(1.6rem, 4vw, 3rem);
        color: #7c2d12;
        word-break: break-word;
      }

      .status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #ecfdf5;
        color: var(--success);
        font-weight: 700;
        min-height: 48px;
        display: flex;
        align-items: center;
      }

      .status.error {
        background: #fef2f2;
        color: var(--danger);
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>抽籤程式</h1>
      </div>

      <div class="content">
        <div class="panel">
          <label for="names">輸入名單（每行一個名字）</label>
          <textarea id="names" placeholder="例如：
小明
小美
阿強
珍珍"></textarea>

          <div class="controls">
            <button class="primary" id="drawBtn">開始抽籤</button>
            <button class="secondary" id="resetBtn" type="button">清空名單</button>
          </div>
        </div>

        <div class="panel result-box">
          <div>
            <div class="result-label">幸運者</div>
            <div class="winner" id="winner">尚未抽籤</div>
          </div>

          <div class="status" id="status">請先輸入參加者名單。</div>
        </div>
      </div>
    </div>

    <script>
      const namesInput = document.getElementById('names');
      const drawBtn = document.getElementById('drawBtn');
      const resetBtn = document.getElementById('resetBtn');
      const winnerView = document.getElementById('winner');
      const statusView = document.getElementById('status');

      function getParticipants() {
        return namesInput.value
          .split(/\r?\n/)
          .map((name) => name.trim())
          .filter((name) => name !== '');
      }

      function showStatus(message, isError = false) {
        statusView.textContent = message;
        statusView.classList.toggle('error', isError);
      }

      function drawWinner() {
        const participants = getParticipants();

        if (participants.length === 0) {
          winnerView.textContent = '尚未抽籤';
          showStatus('請先輸入至少一個名字。', true);
          return;
        }

        const index = Math.floor(Math.random() * participants.length);
        const winner = participants[index];
        winnerView.textContent = winner;
        showStatus(`恭喜！抽到的是：${winner}`);
      }

      function clearAll() {
        namesInput.value = '';
        winnerView.textContent = '尚未抽籤';
        showStatus('名單已清空，請重新輸入。');
      }

      drawBtn.addEventListener('click', drawWinner);
      resetBtn.addEventListener('click', clearAll);

      namesInput.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          drawWinner();
        }
      });
    </script>
  </body>
</html>
